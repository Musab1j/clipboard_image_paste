publish_to: 'none'
version: 1.0.0+1

resolution: workspace

environment:
  sdk: ^3.12.0

dependencies:
  clipboard_image_paste:
    path: ../
  flutter:
    sdk: flutter

dev_dependencies:
  clipboard_image_paste_platform_interface: ^0.1.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
